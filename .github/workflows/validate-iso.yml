name: Validate LIFE OS ISO configuration

on:
  push:
    paths:
      - "iso/**"
      - "scripts/prepare_iso.py"
      - "scripts/validate_iso.py"
      - "tests/test_iso_profiles.py"
      - ".github/workflows/validate-iso.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate edition definitions
        run: python scripts/validate_iso.py
      - name: Run ISO configuration tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_iso_profiles.py
