name: Build LIFE Lite ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build LIFE Lite using Arch Linux
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euc '
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm
              pacman -S --noconfirm archiso python

              python scripts/prepare_iso.py \
                life-lite \
                --output /tmp/life-lite-profile

              mkdir -p /workspace/out/iso

              mkarchiso -v \
                -w /tmp/life-lite-work \
                -o /workspace/out/iso \
                /tmp/life-lite-profile
            '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: life-lite-iso
          path: out/iso/*.iso
          if-no-files-found: error
          retention-days: 3
