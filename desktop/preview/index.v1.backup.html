<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFE OS — Flow Desktop</title>
<style>
:root {
  --ink:#293444;
  --muted:#758393;
  --glass:rgba(255,255,255,.69);
  --border:rgba(255,255,255,.73);
  --shadow:0 18px 65px rgba(34,52,76,.17);
  --accent:#769bb6;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.desktop{height:100dvh;min-height:450px;position:relative;overflow:hidden;background:linear-gradient(165deg,#f3e9de 0%,#ebeff0 34%,#b9d1df 75%,#8cabbc 100%)}
.sun{position:absolute;width:370px;height:370px;right:15%;top:8%;border-radius:50%;background:radial-gradient(circle,#fff8e9 0%,#faf3e5 25%,#faefe000 70%);filter:blur(7px)}
.mountain{position:absolute;left:-10%;width:125%;height:62%;bottom:-18%;border-radius:48% 52% 0 0 / 75% 100% 0 0;background:linear-gradient(160deg,#d8e5e4,#a1bbc7);transform:rotate(-9deg)}
.mountain.two{height:48%;bottom:-23%;left:24%;background:linear-gradient(145deg,#b9d0d2,#7f9fae);transform:rotate(9deg)}
.mountain.three{height:29%;bottom:-15%;left:-12%;background:linear-gradient(180deg,#91b2b3,#7197a3);transform:rotate(0)}
.grain{position:absolute;inset:0;opacity:.25;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.10'/%3E%3C/svg%3E");pointer-events:none}
.topbar{position:absolute;z-index:10;top:0;left:0;right:0;height:42px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.34);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.3);font-size:13px}
.top-left,.top-right{display:flex;align-items:center;gap:20px}
.logo{font-weight:800;letter-spacing:-.6px;font-size:15px;cursor:pointer}
.logo span{color:#5988a5}
.top-right button,.top-left button{border:0;background:none;color:var(--ink);padding:6px}
.desktop-title{position:absolute;z-index:1;top:21%;left:10%;color:#334b5c}
.desktop-title h1{font-size:clamp(38px,6vw,86px);letter-spacing:-5px;margin:0;font-weight:300;line-height:1}
.desktop-title h1 strong{font-weight:650}
.desktop-title p{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#587b91}
.dock{position:absolute;z-index:30;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:24px;background:var(--glass);backdrop-filter:blur(34px) saturate(150%);border:1px solid var(--border);box-shadow:var(--shadow)}
.dock button{width:49px;height:49px;border:0;border-radius:15px;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:23px;transition:.16s;position:relative}
.dock button:hover{transform:translateY(-7px);background:white}
.dock .sep{width:1px;height:32px;background:#a8b2bc;margin:0 4px}
.dock button.on:after{content:"";position:absolute;bottom:-6px;width:5px;height:5px;border-radius:50%;background:#5d829c}
.window{position:absolute;z-index:15;top:14%;left:27%;width:min(670px,78vw);height:min(510px,70vh);border-radius:20px;background:rgba(250,251,251,.87);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.8);box-shadow:0 30px 90px rgba(32,57,76,.25);overflow:hidden;display:none;flex-direction:column}
.window.show{display:flex}
.window-head{height:48px;display:flex;align-items:center;gap:13px;padding:0 16px;border-bottom:1px solid #dae0e3;cursor:move;user-select:none}
.dots{display:flex;gap:7px}
.dot{width:12px;height:12px;border-radius:50%;border:0;padding:0}
.red{background:#ee9c96}.yellow{background:#edc37b}.green{background:#91c4a4}
.window-head strong{flex:1;text-align:center;font-size:13px;font-weight:600}
.window-content{flex:1;overflow:auto;padding:25px}
.window-content h2{font-size:26px;letter-spacing:-1px;margin:0 0 8px}
.window-content p{color:var(--muted);line-height:1.6}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.tile{background:rgba(255,255,255,.75);border:1px solid #e3e9ed;border-radius:15px;padding:18px;min-height:100px}
.tile b{display:block;margin-top:12px;font-size:13px}
.btn{padding:10px 15px;border-radius:11px;border:1px solid #d3dfe5;background:white;color:var(--ink);margin:5px 5px 5px 0}
.btn.active,.btn:hover{background:#d5e7f1;border-color:#9ebed2}
.input{width:100%;border:1px solid #d5e1e8;background:rgba(255,255,255,.8);border-radius:12px;padding:12px;outline:none}
textarea.input{height:180px;resize:vertical;line-height:1.6}
.launcher{position:absolute;z-index:40;left:50%;bottom:100px;transform:translateX(-50%);width:min(470px,90vw);padding:20px;border-radius:22px;background:rgba(250,252,253,.88);backdrop-filter:blur(36px);border:1px solid white;box-shadow:var(--shadow);display:none}
.launcher.show{display:block}
.launcher h3{margin:0 0 14px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}
.apps button{border:0;background:rgba(255,255,255,.75);border-radius:14px;padding:15px 4px;display:grid;gap:7px;justify-items:center;color:var(--ink)}
.apps button span{font-size:27px}
.apps button small{font-size:11px}
.toast{position:absolute;z-index:50;right:20px;top:56px;padding:12px 18px;background:rgba(255,255,255,.87);backdrop-filter:blur(20px);border:1px solid white;border-radius:14px;box-shadow:var(--shadow);display:none;font-size:13px}
body[data-layout="center"] .dock{bottom:0;width:100%;justify-content:center;border-radius:0;padding:7px}
body[data-layout="center"] .dock button{width:43px;height:43px}
body[data-layout="classic"] .dock{left:0;transform:none;bottom:0;width:100%;justify-content:flex-start;border-radius:0;padding:6px 14px}
body[data-layout="minimal"] .dock{bottom:15px;transform:translateX(-50%) scale(.82);opacity:.78}
body[data-layout="minimal"] .desktop-title{top:28%}
body[data-theme="dark"]{--ink:#e9f0f4;--muted:#b4c1cc;--glass:rgba(31,45,58,.73);--border:rgba(255,255,255,.15);--shadow:0 20px 65px #142b4166}
body[data-theme="dark"] .desktop{filter:none;background:linear-gradient(160deg,#2c3b4a,#405c70 60%,#778f9c)}
body[data-theme="dark"] .topbar{background:#22374677}
body[data-theme="dark"] .window,body[data-theme="dark"] .launcher{background:#263847ed}
body[data-theme="dark"] .tile,body[data-theme="dark"] .apps button,body[data-theme="dark"] .dock button{background:#405568}
body[data-theme="dark"] .desktop-title{color:#edf4f7}
body[data-theme="dark"] .desktop-title p{color:#cbdde6}
body[data-theme="dark"] .window-head{border-color:#526777}
body[data-theme="dark"] .btn,body[data-theme="dark"] .input{background:#33495b;color:#eff5f8;border-color:#627789}
@media(max-width:650px){.desktop-title{top:24%;left:6%}.desktop-title h1{letter-spacing:-2px}.window{top:12%;left:4%;width:92vw;height:68vh}.tiles{grid-template-columns:1fr 1fr}.top-left{gap:9px}.top-right{gap:7px}.dock button{width:39px;height:42px}.dock{gap:4px}}
</style>
</head>
<body data-layout="flow" data-theme="light">
<div class="desktop" id="desktop">
  <div class="sun"></div><div class="mountain"></div><div class="mountain two"></div><div class="mountain three"></div><div class="grain"></div>
  <header class="topbar">
    <div class="top-left">
      <div class="logo" onclick="toggleLauncher()">LIFE <span>OS</span></div>
      <button onclick="openApp('files')">Files</button>
      <button onclick="openApp('notes')">Notes</button>
      <button onclick="openApp('settings')">Settings</button>
    </div>
    <div class="top-right">
      <span>◉</span><span>⌁</span><span>▰</span>
      <span id="clock"></span>
      <button onclick="openApp('settings')">⚙</button>
    </div>
  </header>

  <div class="desktop-title">
    <h1>Find your<br><strong>flow.</strong></h1>
    <p>Your space. Your pace.</p>
  </div>

  <section class="window" id="app-window">
    <div class="window-head" id="window-head">
      <div class="dots">
        <button class="dot red" onclick="closeApp()" title="Close"></button>
        <button class="dot yellow" onclick="closeApp()" title="Minimize"></button>
        <button class="dot green" onclick="maximize()" title="Expand"></button>
      </div>
      <strong id="window-title">LIFE OS</strong>
    </div>
    <div class="window-content" id="window-content"></div>
  </section>

  <div class="launcher" id="launcher">
    <h3>Good to see you.</h3>
    <input class="input" id="search" placeholder="Search your applications..." oninput="filterApps(this.value)">
    <div class="apps" id="apps">
      <button data-name="Files" onclick="openApp('files')"><span>▣</span><small>Files</small></button>
      <button data-name="Notes" onclick="openApp('notes')"><span>▤</span><small>Notes</small></button>
      <button data-name="Settings" onclick="openApp('settings')"><span>⚙</span><small>Settings</small></button>
      <button data-name="About" onclick="openApp('about')"><span>◈</span><small>About</small></button>
    </div>
  </div>

  <div class="dock">
    <button onclick="toggleLauncher()" title="App Launcher">◈</button>
    <div class="sep"></div>
    <button onclick="openApp('files')" title="Files">▣</button>
    <button onclick="openApp('notes')" title="Notes">▤</button>
    <button onclick="openApp('settings')" title="Settings">⚙</button>
    <div class="sep"></div>
    <button onclick="openApp('about')" title="About LIFE OS">◎</button>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script>
const win=document.getElementById('app-window');
const content=document.getElementById('window-content');
const titles={files:'Files',notes:'Notes',settings:'LIFE Appearance',about:'About LIFE OS'};
let current='';
const savedLayout=localStorage.getItem('life-layout');
const savedTheme=localStorage.getItem('life-theme');
if(['flow','center','classic','minimal'].includes(savedLayout))document.body.dataset.layout=savedLayout;
if(['light','dark'].includes(savedTheme))document.body.dataset.theme=savedTheme;

function clock(){
  document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
clock();setInterval(clock,30000);

function toggleLauncher(){
  document.getElementById('launcher').classList.toggle('show');
}
function filterApps(q){
  document.querySelectorAll('#apps button').forEach(b=>{
    b.style.display=b.dataset.name.toLowerCase().includes(q.toLowerCase())?'':'none';
  });
}
function toast(text){
  const e=document.getElementById('toast');e.textContent=text;e.style.display='block';
  clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2400);
}
function setLayout(id){
  document.body.dataset.layout=id;localStorage.setItem('life-layout',id);
  openApp('settings');toast('Layout preview: LIFE '+id[0].toUpperCase()+id.slice(1));
}
function setTheme(id){
  document.body.dataset.theme=id;localStorage.setItem('life-theme',id);openApp('settings');
}
function closeApp(){win.classList.remove('show');current='';}
function maximize(){
  const full=win.dataset.max==='yes';
  Object.assign(win.style,full?{top:'14%',left:'27%',width:'min(670px,78vw)',height:'min(510px,70vh)'}:{top:'49px',left:'2%',width:'96%',height:'calc(100dvh - 140px)'});
  win.dataset.max=full?'no':'yes';
}
const layoutNames={flow:'Flow',center:'Center',classic:'Classic',minimal:'Minimal'};
function openApp(id){
  current=id;document.getElementById('launcher').classList.remove('show');
  document.getElementById('window-title').textContent=titles[id];
  if(id==='files'){
    content.innerHTML='<h2>Your files, your space.</h2><p>Explore your LIFE OS workspace.</p><div class="tiles"><div class="tile">▣<b>Documents</b></div><div class="tile">▧<b>Pictures</b></div><div class="tile">♫<b>Music</b></div><div class="tile">▥<b>Downloads</b></div><div class="tile">◇<b>Projects</b></div><div class="tile">◈<b>LIFE OS</b></div></div><p>Visual preview — filesystem access will be provided by the native Files app.</p>';
  }else if(id==='notes'){
    content.innerHTML='<h2>A little space to think.</h2><p>Capture ideas, plan projects, and keep what matters.</p><input id="noteTitle" class="input" placeholder="Note title" style="margin-bottom:12px"><textarea id="noteBody" class="input" placeholder="Start writing..."></textarea><p style="font-size:12px">Preview-only notes saved in this browser.</p>';
    document.getElementById('noteTitle').value=localStorage.getItem('life-preview-title')||'';
    document.getElementById('noteBody').value=localStorage.getItem('life-preview-note')||'';
    document.getElementById('noteTitle').oninput=e=>localStorage.setItem('life-preview-title',e.target.value);
    document.getElementById('noteBody').oninput=e=>localStorage.setItem('life-preview-note',e.target.value);
  }else if(id==='settings'){
    const layout=document.body.dataset.layout,theme=document.body.dataset.theme;
    content.innerHTML='<h2>Make LIFE yours.</h2><p>One system. Different ways to feel at home.</p><h3>Desktop layout</h3>'+
      Object.entries(layoutNames).map(([key,name])=>'<button class="btn '+(layout===key?'active':'')+'" onclick="setLayout(\''+key+'\')">LIFE '+name+'</button>').join('')+
      '<h3>Appearance</h3><button class="btn '+(theme==='light'?'active':'')+'" onclick="setTheme(\'light\')">☀ Warm Light</button><button class="btn '+(theme==='dark'?'active':'')+'" onclick="setTheme(\'dark\')">☾ Deep Night</button><p>These settings affect the interactive preview. Native XFCE/KDE integration is being developed separately.</p>';
  }else{
    content.innerHTML='<h2>LIFE OS</h2><p>Live Intuitively. Focus Effortlessly.</p><div class="tiles"><div class="tile">◈<b>Made for focus</b></div><div class="tile">◇<b>Designed for comfort</b></div><div class="tile">▣<b>Built on Linux</b></div></div><p>Milestone 7 — LIFE Flow desktop concept.<br>Created for LIFE Lite and LIFE Standard.</p>';
  }
  win.classList.add('show');
}
let dragging=false,dx=0,dy=0;
const head=document.getElementById('window-head');
head.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  dragging=true;const r=win.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;head.setPointerCapture(e.pointerId);
});
head.addEventListener('pointermove',e=>{
  if(!dragging)return;
  win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,e.clientX-dx))+'px';
  win.style.top=Math.max(42,Math.min(innerHeight-win.offsetHeight,e.clientY-dy))+'px';
});
head.addEventListener('pointerup',()=>dragging=false);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.getElementById('launcher').classList.remove('show');closeApp();}
});
</script>
</body>
</html>
